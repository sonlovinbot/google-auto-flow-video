<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Coachio Video Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="gateway.css">
</head>

<body>
  <div class="top-bar">
    <div class="lang-switch">
      <span class="material-symbols-outlined">language</span>
      <select id="languageSelector">
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
        <option value="hi">हिन्दी (India)</option>
        <option value="th">ไทย (Thailand)</option>
        <option value="ur">اردو (Pakistan)</option>
        <option value="bn">বাংলা (Bangladesh)</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Coachio Video Flow">
        <defs>
          <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8ab4f8" />
            <stop offset="1" stop-color="#81c995" />
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#logo-gradient)" />
        <path d="M20 22h24v7H20zm0 13h16v7H20z" fill="#1a202c" />
        <path d="m39 34 10 5-10 5z" fill="#1a202c" />
      </svg>
      <h1>Coachio Video Flow</h1>
      <p data-lang-key="subtitle">Automated Task Manager for Flow AI (Veo)</p>
    </div>

    <div class="versions">
      <div class="version-card classic" id="btn-classic">
        <div class="badge-classic" data-lang-key="badge_classic">EXTENSION</div>
        <div class="icon-area">
          <span class="material-symbols-outlined">extension</span>
        </div>
        <div class="info">
          <h3 data-lang-key="classic_title">Version 8.5.0 (Extension)</h3>
          <p data-lang-key="classic_desc">
            Phiên bản tiện ích mở rộng quen thuộc. Chạy trực tiếp trên trình duyệt Chrome.
          </p>
        </div>
        <span class="material-symbols-outlined arrow">chevron_right</span>
      </div>

    </div>

    <div class="footer">
      Coachio Video Flow
    </div>
  </div>
  <script src="gateway.js"></script>
</body>

</html>
